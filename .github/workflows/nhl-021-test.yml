name: NHL 0.21 IRQ test Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Download exact v0.21.0 source
        uses: actions/checkout@v6
        with:
          repository: shadps4-emu/shadPS4
          ref: 11557f2eb60b3b00712c8887c30852de7615d6df
          submodules: recursive
          persist-credentials: false

      - name: Apply experimental port of PR 4183
        shell: python
        run: |
          import base64, pathlib, subprocess
          patch = base64.b64decode("")
          pathlib.Path("nhl-021-irq.patch").write_bytes(patch)
          subprocess.run(["git", "apply", "--check", "nhl-021-irq.patch"], check=True)
          subprocess.run(["git", "apply", "nhl-021-irq.patch"], check=True)
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "diff", "--stat"], check=True)
          pathlib.Path("NHL-TEST.txt").write_text(
              "Experimental PR4183 port onto shadPS4 v0.21.0\n"
              "Base: 11557f2eb60b3b00712c8887c30852de7615d6df\n"
              "Not an official release. NHL crash fix is not yet verified.\n"
              "Keep your original emulator and back up saves/config before testing.\n"
          )

      - name: Configure and build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools not found" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test emulator
        uses: actions/upload-artifact@v7
        with:
          name: shadPS4-v021-NHL-IRQ-test
          path: |
            build/shadPS4.exe
            build/*.dll
            nhl-021-irq.patch
            NHL-TEST.txt
          if-no-files-found: error
          retention-days: 14
